[package]
name = "clipboard-hold"
version = "0.1.0"
edition = "2021"
publish = false
description = "clipboard-hold — hold the Windows clipboard open for a bounded time, to test what another process does about it"

[[bin]]
name = "clipboard-hold"
path = "src/main.rs"

# Windows-only by nature: the whole tool is one Win32 call held open.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    # PeekMessage / DispatchMessage — a thread holding the clipboard has to
    # answer messages, or Windows takes it back. Measured, not assumed.
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]
