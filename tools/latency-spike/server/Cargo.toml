[package]
name = "rhydra"
version = "0.0.0"
edition = "2021"
publish = false
description = "rhydra — mdrdp's native Windows capture/encode/send server and session agent"

[[bin]]
name = "rhydra-server"
path = "src/main.rs"

[[bin]]
name = "rhydra-agent"
path = "src/bin/agent.rs"

[dependencies]
# Same versions as the repository root Cargo.toml.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only, and only for the Windows target: the pure-logic modules
# (framing/annexb/input_proto/stats) build and test natively on macOS with no
# platform dependency at all.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # OpenFileMappingW / MapViewOfFile — the IddCx shared section.
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
debug = 1

# Standalone: never a member of the mdrdp package above it.
[workspace]
