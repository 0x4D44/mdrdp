[package]
name = "rhydra"
version = "0.4.0"
edition = "2021"
publish = false
description = "rhydra — mdrdp's native Windows capture/encode/send server and session agent"

[features]
# On by default: the host-only capture/encode/inject stack (win, agent,
# idd_section) plus the two host binaries. mdrdp takes this crate as
# `default-features = false` so its client build links only the portable half
# — framing, rects, input records, control client, stats types — never DXGI
# duplication, the MF encoder, or the SendInput injector (HLD tranche 3 §3).
default = ["host"]
host = ["dep:windows"]

[[bin]]
name = "rhydra-server"
path = "src/main.rs"
required-features = ["host"]

[[bin]]
name = "rhydra-agent"
path = "src/bin/agent.rs"
required-features = ["host"]

[dependencies]
# Same versions as the repository root Cargo.toml.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only, and only for the Windows target: the pure-logic modules
# (framing/annexb/input_proto/stats) build and test natively on macOS with no
# platform dependency at all. Also gated behind the `host` feature (optional +
# `dep:windows`) so a `host`-disabled build never even considers linking it,
# even on a Windows target.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    # GetTcpTable2 — the server rung asks the OS whether anything is LISTENING on
    # the video port. Read-only on purpose: connecting to 9500 to find out would
    # take the capture server's single viewer slot and unpark its capture loop,
    # so the check would disturb the very thing it measures.
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Com",
    # OpenClipboard / GetClipboardData / SetClipboardData / EmptyClipboard and
    # GetClipboardSequenceNumber — the host's half of the auxiliary channel's
    # clipboard (win::clipboard).
    "Win32_System_DataExchange",
    # OpenFileMappingW / MapViewOfFile — the IddCx shared section.
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    # GetProcessWindowStation / GetThreadDesktop / GetUserObjectInformationW —
    # the input-desktop diagnostic (why SendInput can succeed and do nothing).
    "Win32_System_StationsAndDesktops",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# [profile.release] intentionally absent: as a path dependency of mdrdp this
# is a non-root profile, which cargo warns about on every mdrdp build. The
# debug-symbol setting it carried moves to build.sh's cargo invocation
# (`--config 'profile.release.debug=1'`), the only place that still does a
# release build of this crate standalone.

# Standalone: never a member of the mdrdp package above it.
[workspace]
