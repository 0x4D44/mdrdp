[package]
name = "audio-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "audio-probe — ask WASAPI whether this host has a render endpoint loopback capture could attach to"

[[bin]]
name = "audio-probe"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[workspace]
