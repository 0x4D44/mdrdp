[package]
name = "mf-caps-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "mf-caps-probe — what a Windows host's Media Foundation encoders will actually accept"

[[bin]]
name = "mf-caps-probe"
path = "src/main.rs"

# Windows-only. The bitstream parsers are pure logic and build anywhere, which is
# what makes `cargo check` on the Mac a useful first gate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # D3D12CreateDevice. The D3D12 *video* encode types live under
    # Win32_Media_MediaFoundation in this crate, not here.
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[profile.release]
debug = 1

# Standalone: never a member of the mdrdp package above it.
[workspace]
