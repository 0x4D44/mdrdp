[package]
name = "mdrdp"
version = "0.1.53"
edition = "2024"
description = "A fast, portable RDP client for macOS and Windows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0x4d44/mdrdp"

[dependencies]
arboard = "3"
ironrdp = { version = "0.17.0", features = ["connector", "session", "svc", "dvc", "graphics", "cliprdr", "displaycontrol"] }
cpal = "0.16"
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = "0.36"
egui-winit = "0.36"
egui_glow = { version = "0.36", features = ["winit"] }
glutin = "0.32"
glutin-winit = "0.5"
muda = "0.19"
png = "0.18"
ironrdp-blocking = "0.10.0"
ironrdp-cliprdr = "0.7.0"
ironrdp-connector = "0.10.0"
ironrdp-dvc = "0.8.0"
ironrdp-egfx = "0.3.0"
ironrdp-graphics = "0.9.0"
ironrdp-rdpdr = "0.7.0"
ironrdp-rdpsnd = "0.9.0"
ironrdp-session = "0.11.0"
ironrdp-svc = "0.8.0"
keyring = "4.1.6"
rpassword = "7"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
softbuffer = "0.4.8"
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std", "fmt", "env-filter"] }
winit = "0.30.13"
x509-cert = "0.2.5"
zeroize = "1.9.0"

# Readiness polling for the session pump's wake-able wait (src/wake.rs): poll(2) on
# Unix, WSAPoll on Windows. Both crates were already in the dependency tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `probe glass`, the keypress-to-photon instrument (src/probe/glass). macOS-only by
# construction: it needs ScreenCaptureKit for the watched region, CoreMedia for the
# presentation-timestamp clock the whole measurement hangs on, and CoreGraphics for the
# injected keystroke and the permission preflights. All four crates are the objc2
# family at the version winit already pins (objc2 0.6), so nothing new enters the tree
# beyond the frameworks themselves.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[build-dependencies]
# Embeds assets/icon/windows/mdrdp.ico into the Windows executable; a no-op elsewhere.
winresource = "0.1"

[patch.crates-io]
# See vendor/README.md — one flag, without which EGFX never opens.
ironrdp-connector = { path = "vendor/ironrdp-connector" }
# ResetGraphics resizes the output buffer; it does not destroy offscreen surfaces.
ironrdp-egfx = { path = "vendor/ironrdp-egfx" }
# See vendor/README.md — RFX Progressive `quality` is a level, not a table index.
ironrdp-graphics = { path = "vendor/ironrdp-graphics" }
# See vendor/README.md — ClearCodec short-V-bar yOn/yOff were transposed.
ironrdp-pdu = { path = "vendor/ironrdp-pdu" }
# Preserve the client format order and report the exact negotiated list to playback.
ironrdp-rdpsnd = { path = "vendor/ironrdp-rdpsnd" }
# Answer Bandwidth Measure requests; an unanswered probe makes Windows throttle EGFX.
ironrdp-session = { path = "vendor/ironrdp-session" }
