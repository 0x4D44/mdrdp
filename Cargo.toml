[package]
name = "mdrdp"
version = "0.1.117"
edition = "2024"
description = "A fast, portable RDP client for macOS and Windows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0x4d44/mdrdp"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3"
ironrdp = { version = "0.17.0", features = ["connector", "session", "svc", "dvc", "graphics", "cliprdr", "displaycontrol"] }
cpal = "0.16"
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = "0.36"
egui-winit = "0.36"
egui_glow = { version = "0.36", features = ["winit"] }
glutin = "0.32"
glutin-winit = "0.5"
muda = "0.19"
png = "0.18"
ironrdp-blocking = "0.10.0"
ironrdp-cliprdr = "0.7.0"
ironrdp-connector = "0.10.0"
ironrdp-dvc = "0.8.0"
ironrdp-egfx = "0.3.0"
ironrdp-graphics = "0.9.0"
ironrdp-rdpdr = "0.7.0"
ironrdp-rdpsnd = "0.9.0"
ironrdp-session = "0.11.0"
ironrdp-svc = "0.8.0"
keyring = "4.1.6"
# The native transport's wire: one implementation of framing, rects, input
# records, control client and stats types, shared with the rhydra host stack.
# default-features = false takes only the portable half — never the capture/
# encode/inject host code (rhydra's `host` feature).
rhydra = { path = "tools/latency-spike/server", default-features = false }
rpassword = "7"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
softbuffer = "0.4.8"
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std", "fmt", "env-filter"] }
winit = "0.30.13"
x509-cert = "0.2.5"
zeroize = "1.9.0"

# Readiness polling for the session pump's wake-able wait (src/wake.rs): poll(2) on
# Unix, WSAPoll on Windows. Both crates were already in the dependency tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `probe glass`, the keypress-to-photon instrument (src/probe/glass). macOS-only by
# construction: it needs ScreenCaptureKit for the watched region, CoreMedia for the
# presentation-timestamp clock the whole measurement hangs on, and CoreGraphics for the
# injected keystroke and the permission preflights. All four crates are the objc2
# family at the version winit already pins (objc2 0.6), so nothing new enters the tree
# beyond the frameworks themselves.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
# The Dock tile (src/dock.rs) hands a composed RGBA buffer to NSApplication.
# Already in the tree at this version via winit; only these four classes are
# enabled, and the pixels are composed in portable Rust, not AppKit.
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
# The IOSurface present path (src/present.rs): frames composite on the GPU instead of
# softbuffer's per-present CPU colorspace re-render (MDR-BUG-FLUX-00005). Both crates
# were already in the tree transitively (softbuffer, objc2-core-video) at this version.
objc2-io-surface = "0.3.2"
objc2-quartz-core = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[build-dependencies]
# Embeds assets/icon/windows/mdrdp.ico into the Windows executable; a no-op elsewhere.
winresource = "0.1"

# NOT a cargo workspace, deliberately. See scripts/test-vendored.sh.
#
# Making the vendored crates workspace members does make `cargo test --workspace` run their
# own suites — but it also resolves their dev-dependencies and optional features into
# Cargo.lock, which adds 37 packages including `winscard`, `libz-sys`, `openh264`,
# `zstd-sys` and `nasm-rs`. CLAUDE.md is explicit that the `winscard -> flate2/zlib ->
# libz-sys` subtree is what breaks `scripts/check-windows.sh`, so that cure is worse than
# the disease (measured 2026-08-19, MDR-BUG-FLUX-00016).

[patch.crates-io]
# See vendor/README.md — one flag, without which EGFX never opens.
ironrdp-connector = { path = "vendor/ironrdp-connector" }
# ResetGraphics resizes the output buffer; it does not destroy offscreen surfaces.
ironrdp-egfx = { path = "vendor/ironrdp-egfx" }
# See vendor/README.md — RFX Progressive `quality` is a level, not a table index.
ironrdp-graphics = { path = "vendor/ironrdp-graphics" }
# See vendor/README.md — ClearCodec short-V-bar yOn/yOff were transposed.
ironrdp-pdu = { path = "vendor/ironrdp-pdu" }
# Preserve the client format order and report the exact negotiated list to playback.
ironrdp-rdpsnd = { path = "vendor/ironrdp-rdpsnd" }
# Answer Bandwidth Measure requests; an unanswered probe makes Windows throttle EGFX.
ironrdp-session = { path = "vendor/ironrdp-session" }
