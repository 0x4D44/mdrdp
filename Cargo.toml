[package]
name = "mdrdp"
version = "0.1.2"
edition = "2024"
description = "A fast, portable RDP client for macOS and Windows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0x4d44/mdrdp"

[dependencies]
ironrdp = { version = "0.17.0", features = ["connector", "session", "svc", "dvc", "graphics", "cliprdr"] }
ironrdp-blocking = "0.10.0"
keyring = "4.1.6"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
x509-cert = "0.2.5"
zeroize = "1.9.0"
